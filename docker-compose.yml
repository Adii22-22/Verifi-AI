services:
  # ─── Redis Cache & Rate Limiting ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: verifi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: verifi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Automatically connect to the Redis container by hostname
      - REDIS_URL=redis://redis:6379/0
      # Pass through API keys from host environment or .env
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME:-llama-3.1-8b-instant}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
    depends_on:
      - redis

  # ─── React Vite Frontend (Nginx SPA) ────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: verifi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
    driver: local
