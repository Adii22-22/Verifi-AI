name: Verifi.ai CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── 1. Backend Verification ─────────────────────────────────
  backend-test:
    name: Backend Lint & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Verify Backend Imports & Syntax
        run: |
          cd Backend
          python -c "import sys; sys.path.insert(0, '.'); from src.api import app; print('Backend syntax and imports verified!')"

  # ─── 2. Frontend Verification ────────────────────────────────
  frontend-test:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd Frontend
          npx tsc --noEmit

      - name: Run Vite Production Build
        run: |
          cd Frontend
          npm run build

  # ─── 3. Docker Compose Build Verification ─────────────────────
  docker-build:
    name: Docker Multi-Container Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Containers
        run: |
          docker compose build
